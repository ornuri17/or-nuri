[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Link = '''</llms.txt>; rel="describedby"; type="text/plain", </for-bots/>; rel="describedby", </sitemap.xml>; rel="sitemap"'''

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/jwks.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/agent-card.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/auth.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/.well-known/agent-skills/*"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json"

[[edge_functions]]
  function = "markdown-agent"
  path = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
